name: LLM relay

on:
  pull_request:
    paths: ['server/llm-relay/**', '.github/workflows/llm-relay.yml']
  push:
    branches: [main]
    paths: ['server/llm-relay/**', '.github/workflows/llm-relay.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/llm-relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/llm-relay/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir dist
